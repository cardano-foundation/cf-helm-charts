## cf-cardano-ibc — preprod profile
##
## Cardano side cardano-node / ogmios / kupo / yaci-store follow public preprod
## and serve a local follower. Hermes relays to Injective public testnet.
## Postgres (Zalando) + Injective RPC are external.
##
## The `files/preprod/` directory in this chart carries the canonical preprod
## cardano-node config + genesis + topology JSON downloaded from
## https://book.world.dev.cardano.org/environments/preprod and embedded here.
## `cardano-node.configFiles` below seeds the cardano-node ConfigMap so the
## node boots against the real preprod network out of the box.

## ----- Cardano node -----------------------------------------------------------
## Network identifiers + preprod config files. Setting `configFiles` (the
## inline map below) makes the cardano-node chart render a ConfigMap with
## these files under /config/<network>/  and mount it at configContainerPath,
## so `CARDANO_CONFIG` / `CARDANO_TOPOLOGY` resolve to real content.
cf-cardano-node:
  network: preprod
  protocolMagic: 1

## ----- Ogmios / Kupo ----------------------------------------------------------
## ogmios and kupo read cardano-node.json + genesis from a config volume.
## NOTE: their templates do not yet mount a config volume — that wiring is a
## follow-up. Once added, point them at the cardano-node ConfigMap so they
## boot against preprod without duplicating the files.
cf-ogmios:
  network: preprod

cf-kupo:
  source: ogmios
  cardanoNode:
    network: preprod
    networkMagic: 1
  since: origin
  match: "*"

## ----- Yaci Store -------------------------------------------------------------
## yaci-store chain-follows the in-cluster cardano-node over n2n (3001). The
## preprod sync checkpoint below MUST be a recent epoch-boundary block (1-2
## epochs before bridge deployment). Caribic normally resolves this via
## `caribic yaci-checkpoint --network preprod --epochs-back 2`; for Helm, fill
## these at install time — leaving them at 0 is only valid for devnet.
yaci-store:
  enabled: true
  cardanoNode:
    network: preprod
    networkMagic: 1
  syncStartSlot: 0
  syncStartBlockHash: ""
  syncStartBlockNo: 0

## ----- Gateway ----------------------------------------------------------------
gateway:
  enabled: true
  env:
    CARDANO_CHAIN_ID: cardano-preprod
    CARDANO_NETWORK_MAGIC: "1"
    CARDANO_CHAIN_NETWORK_MAGIC: "1"
    CARDANO_LIGHT_CLIENT_MODE: stake-weighted-stability
    CARDANO_EPOCH_NONCE_GENESIS: ""
    CARDANO_STABILITY_THRESHOLD_DEPTH: "10"
    CARDANO_STABILITY_THRESHOLD_UNIQUE_POOLS: "2"
    CARDANO_STABILITY_THRESHOLD_UNIQUE_STAKE_BPS: "6000"
    HANDLER_JSON_PATH: /usr/src/app/cardano/offchain/deployments/handler.json
    GATEWAY_DB_HOST: ""
    GATEWAY_DB_PORT: "5432"
    GATEWAY_DB_NAME: gateway_app
    GATEWAY_DB_SYNCHRONIZE: "true"
    HISTORY_DB_HOST: ""
    HISTORY_DB_PORT: "5432"
    HISTORY_DB_NAME: yaci_store
    KUPO_ENDPOINT: http://kupo:1442
    OGMIOS_ENDPOINT: http://ogmios:1337
    YACI_STORE_ENDPOINT: http://yaci-store:8080
    CARDANO_CHAIN_HOST: cardano-node
    CARDANO_CHAIN_PORT: "3001"

## ----- Hermes ----------------------------------------------------------------
## Cardano block points at the in-cluster gateway gRPC. Injective points at the
## public Injective testnet sentries. Testnet gas parameters mirror caribic's
## `testnet_chain_profile()` (caribic/src/chains/injective/hermes.rs).
hermes:
  enabled: true
  config:
    cardano:
      chainId: cardano-preprod
      gatewayUrl: http://gateway:5001
      networkId: 0
      keyName: cardano-relayer
    injective:
      chainId: injective-888
      rpcAddr: https://testnet.sentry.tm.injective.network:443
      grpcAddr: https://testnet.sentry.chain.grpc.injective.network:443
      eventSourceUrl: wss://testnet.sentry.tm.injective.network:443/websocket

## ----- dApps ------------------------------------------------------------------
dapps:
  enabled: false

## ----- Postgres (Zalando operator, single cluster) --------------------------
## The chart renders a `postgresql` CRD that creates one cluster with two
## databases (gateway_app, yaci_store) and two users (gateway, yaci). The
## operator generates credential Secrets named <cluster>-<user>.
## Leave hosts/secrets empty to derive them from global.postgres.clusterName.
postgres:
  enabled: true
  namespace: "zpg-system"
  teamId: cardano-ibc
