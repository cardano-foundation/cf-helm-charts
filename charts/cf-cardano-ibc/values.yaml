            - path: /
              pathType: Prefix
      tls: []
  explorer:
    enabled: true
    image:
      repository: pro.registry.gitlab.metadata.dev.cf-deployments.org/base-infrastructure/docker-registry/cardano-ibc-explorer
      tag:
      pullPolicy: IfNotPresent
    port: 8080
    apiDomain: ""
    cardanoChainId: ""
    localOsmosisRpcEndpoint: ""
    localOsmosisRestEndpoint: ""
    extraEnv: []
    resources: {}
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: explorer.example.local
          paths:
            - path: /
              pathType: Prefix
      tls: []
  nameOverride: ""
  fullnameOverride: ""
  imagePullSecrets: []
