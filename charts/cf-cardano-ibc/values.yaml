    port: 3000
    basePath: ""
    mode: ""
    cardanoNetwork: ""
    gatewayEndpoint: ""
    publicGatewayEndpoint: ""
    cardanoBridgeManifestUrl: ""
    publicCardanoBridgeManifestUrl: ""
    localOsmosisRpcEndpoint: ""
    localOsmosisRestEndpoint: ""
    blockfrostProjectId: ""
    kupoEndpoint: ""
    ogmiosEndpoint: ""
    kupmiosUrl: ""
    publicKupmiosUrl: ""
    cardanoChainId: ""
    cardanoIbcChainId: ""
    injectiveRpcEndpoint: ""
    injectiveRestEndpoint: ""
    crosschainSwapAddress: ""
    forwardTimeout: 60m
    enableMainnet: "false"
    allowedOrigins: ""
    kupmiosApiKeys:
      existingSecret: ""
      kupoKey: kupo-api-key
      ogmiosKey: ogmios-api-key
    extraEnv: []
    resources: {}
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: swap.example.local
