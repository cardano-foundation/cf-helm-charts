{{- if and .Values.dapps.explorer.enabled .Values.dapps.explorer.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-ingress" (include "dapps.explorerFullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: ibc-explorer
    app.kubernetes.io/part-of: cardano-ibc
  {{- with .Values.dapps.explorer.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.dapps.explorer.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.dapps.explorer.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.dapps.explorer.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- $paths := .paths | default (list (dict "path" "/" "pathType" "Prefix")) }}
          {{- range $paths }}
          - path: {{ .path | default "/" | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "dapps.explorerFullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
