{{- if .Values.dapps.explorer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dapps.explorerFullname" . }}
  labels:
    app.kubernetes.io/name: ibc-explorer
    app.kubernetes.io/part-of: cardano-ibc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ibc-explorer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ibc-explorer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.dapps.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: explorer
          image: {{ printf "%s:%s" .Values.dapps.explorer.image.repository (.Values.dapps.explorer.image.tag | default "latest") | quote }}
          imagePullPolicy: {{ .Values.dapps.explorer.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.dapps.explorer.port | toString | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: REACT_APP_CARDANO_CHAIN_ID
              value: {{ include "dapps.explorerCardanoChainId" . | toString | quote }}
            {{- with .Values.dapps.explorer.apiDomain }}
            - name: REACT_APP_API_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dapps.explorer.localOsmosisRpcEndpoint }}
            - name: REACT_APP_LOCALOSMOIS_RPC_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dapps.explorer.localOsmosisRestEndpoint }}
            - name: REACT_APP_LOCALOSMOIS_REST_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dapps.explorer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.dapps.explorer.port }}
              protocol: TCP
          resources: {{- toYaml .Values.dapps.explorer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dapps.explorerFullname" . }}
  labels:
    app.kubernetes.io/name: ibc-explorer
    app.kubernetes.io/part-of: cardano-ibc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ibc-explorer
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.dapps.explorer.port }}
      targetPort: http
      protocol: TCP
{{- end }}
