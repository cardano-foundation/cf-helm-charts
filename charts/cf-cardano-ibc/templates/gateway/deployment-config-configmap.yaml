{{- if include "gateway.deploymentConfigInlineConfigMapEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.deploymentConfigConfigMapName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-deployment-config
data:
  {{ include "gateway.deploymentConfigKey" . }}: |-
{{ .Values.gateway.deploymentConfig.configMap.content | nindent 4 }}
{{- end }}
