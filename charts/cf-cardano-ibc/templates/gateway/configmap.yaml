{{- $deployment := .Values.gateway.deploymentConfig -}}
{{- if and $deployment.path (or $deployment.configMap.name $deployment.configMap.content) -}}
{{- fail "set gateway.deploymentConfig.path or gateway.deploymentConfig.configMap, not both" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.fullname" . }}-env
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.gateway.restPort | quote }}
  GRPC_HOST: {{ ternary "0.0.0.0" "127.0.0.1" (not (empty .Values.gateway.grpcTls.existingSecret)) | quote }}
  GRPC_PORT: {{ .Values.gateway.grpcPort | quote }}
{{- if .Values.gateway.grpcTls.existingSecret }}
  GRPC_TLS_CERT_FILE: "/etc/cardano-ibc-grpc/tls.crt"
  GRPC_TLS_KEY_FILE: "/etc/cardano-ibc-grpc/tls.key"
{{- end }}

  CARDANO_CHAIN_ID: {{ .Values.gateway.env.CARDANO_CHAIN_ID | quote }}
  CARDANO_NETWORK_MAGIC: {{ .Values.gateway.env.CARDANO_NETWORK_MAGIC | quote }}
  CARDANO_CHAIN_NETWORK_MAGIC: {{ required "gateway.env.CARDANO_CHAIN_NETWORK_MAGIC must match the selected Cardano network" .Values.gateway.env.CARDANO_CHAIN_NETWORK_MAGIC | quote }}
  CARDANO_RANDOMNESS_STABILISATION_WINDOW_SLOTS: {{ .Values.gateway.env.CARDANO_RANDOMNESS_STABILISATION_WINDOW_SLOTS | quote }}
  CARDANO_STABILITY_CHECKPOINT_MAX_BRIDGE_BLOCKS: {{ .Values.gateway.env.CARDANO_STABILITY_CHECKPOINT_MAX_BRIDGE_BLOCKS | quote }}
{{- with .Values.gateway.env.CARDANO_BLOCKFROST_ENDPOINT }}
  CARDANO_BLOCKFROST_ENDPOINT: {{ . | quote }}
{{- end }}
{{- with .Values.gateway.env.MITHRIL_ENDPOINT }}
  MITHRIL_ENDPOINT: {{ . | quote }}
{{- end }}

  BRIDGE_MANIFEST_PATH: {{ include "gateway.deploymentConfigPath" . | quote }}
  KUPO_ENDPOINT: {{ include "gateway.kupoEndpoint" . | quote }}
  OGMIOS_ENDPOINT: {{ include "gateway.ogmiosEndpoint" . | quote }}
  OGMIOS_REQUEST_TIMEOUT_MS: {{ .Values.gateway.env.OGMIOS_REQUEST_TIMEOUT_MS | quote }}
  YACI_STORE_ENDPOINT: {{ include "gateway.yaciStoreEndpoint" . | quote }}
  GATEWAY_READINESS_PROOF_TIMEOUT_MS: {{ .Values.gateway.env.GATEWAY_READINESS_PROOF_TIMEOUT_MS | quote }}
  BRIDGE_HISTORY_SYNC_TIMEOUT_SECONDS: {{ .Values.gateway.env.BRIDGE_HISTORY_SYNC_TIMEOUT_SECONDS | quote }}

  GATEWAY_DB_HOST: {{ include "gateway.gatewayDbHost" . | quote }}
  GATEWAY_DB_PORT: {{ .Values.gateway.env.GATEWAY_DB_PORT | quote }}
  GATEWAY_DB_NAME: {{ include "gateway.gatewayDbName" . | quote }}
  GATEWAY_DB_SYNCHRONIZE: {{ .Values.gateway.env.GATEWAY_DB_SYNCHRONIZE | quote }}
{{- with .Values.gateway.env.PGSSLMODE }}
  PGSSLMODE: {{ . | quote }}
{{- end }}
