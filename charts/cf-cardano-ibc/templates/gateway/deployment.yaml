apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}-app
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-app
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway-app
  template:
    metadata:
      labels:
        {{- include "gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway-app
        {{- with .Values.gateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
        {{- if include "gateway.deploymentConfigInlineConfigMapEnabled" . }}
        checksum/deployment-config: {{ include (print $.Template.BasePath "/gateway/deployment-config-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.gateway.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - name: wait-for-yaci-store
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              until nc -z {{ include "gateway.yaciStoreHost" . }} 8080 2>/dev/null; do
                echo waiting yaci-store; sleep 5
              done
              echo yaci-store ready
        - name: wait-for-gateway-db
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              until nc -z {{ include "gateway.gatewayDbHost" . }} 5432 2>/dev/null; do
                echo waiting gateway-db; sleep 5
              done
              echo gateway-db ready

      containers:
        - name: gateway
          image: {{ include "gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gateway.fullname" . }}-env
          env:
            - name: GATEWAY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.gatewayDbSecretName" . }}
                  key: {{ include "gateway.gatewayDbSecretUsernameKey" . }}
            - name: GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.gatewayDbSecretName" . }}
                  key: {{ include "gateway.gatewayDbSecretPasswordKey" . }}
            - name: HISTORY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.yaciDbSecretName" . }}
                  key: {{ include "gateway.yaciDbSecretUsernameKey" . }}
            - name: HISTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.yaciDbSecretName" . }}
                  key: {{ include "gateway.yaciDbSecretPasswordKey" . }}
{{ with .Values.gateway.koiosApiKeySecret.name }}
            - name: CARDANO_KOIOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.gateway.koiosApiKeySecret.key | quote }}
{{ end }}
          ports:
            - name: rest
              containerPort: {{ .Values.gateway.restPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.gateway.grpcPort }}
              protocol: TCP
          {{- if include "gateway.deploymentConfigVolumeEnabled" . }}
          volumeMounts:
            - name: deployment-config
              mountPath: {{ .Values.gateway.deploymentConfig.mountPath | default "/etc/cardano-ibc" | quote }}
              readOnly: true
          {{- end }}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.restPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.restPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.restPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      {{- if include "gateway.deploymentConfigVolumeEnabled" . }}
      volumes:
        - name: deployment-config
          configMap:
            name: {{ include "gateway.deploymentConfigConfigMapName" . }}
            items:
              - key: {{ include "gateway.deploymentConfigKey" . }}
                path: {{ include "gateway.deploymentConfigFileName" . }}
      {{- end }}
---
{{- if .Values.gateway.historySync.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}-history-sync
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-history-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway-history-sync
  template:
    metadata:
      labels:
        {{- include "gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway-history-sync
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
        {{- if include "gateway.deploymentConfigInlineConfigMapEnabled" . }}
        checksum/deployment-config: {{ include (print $.Template.BasePath "/gateway/deployment-config-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.gateway.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-yaci-store
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              until nc -z {{ include "gateway.yaciStoreHost" . }} 8080 2>/dev/null; do
                echo waiting yaci-store; sleep 5
              done
      containers:
        - name: history-sync
          image: {{ include "gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command:
            - node
            - dist/scripts/yaci-bridge-history-sync.js
          envFrom:
            - configMapRef:
                name: {{ include "gateway.fullname" . }}-env
          env:
            - name: HISTORY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.yaciDbSecretName" . }}
                  key: {{ include "gateway.yaciDbSecretUsernameKey" . }}
            - name: HISTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.yaciDbSecretName" . }}
                  key: {{ include "gateway.yaciDbSecretPasswordKey" . }}
          {{- if include "gateway.deploymentConfigVolumeEnabled" . }}
          volumeMounts:
            - name: deployment-config
              mountPath: {{ .Values.gateway.deploymentConfig.mountPath | default "/etc/cardano-ibc" | quote }}
              readOnly: true
          {{- end }}
          resources: {{- toYaml .Values.gateway.historySyncResources | nindent 12 }}
      {{- if include "gateway.deploymentConfigVolumeEnabled" . }}
      volumes:
        - name: deployment-config
          configMap:
            name: {{ include "gateway.deploymentConfigConfigMapName" . }}
            items:
              - key: {{ include "gateway.deploymentConfigKey" . }}
                path: {{ include "gateway.deploymentConfigFileName" . }}
      {{- end }}
{{- end }}
