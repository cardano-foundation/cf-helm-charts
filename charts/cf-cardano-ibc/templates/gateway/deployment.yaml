{{- $mountManifest := include "gateway.deploymentConfigVolumeEnabled" . -}}
{{- $tlsSecret := .Values.gateway.grpcTls.existingSecret -}}
{{- $startupBudget := .Values.gateway.env.BRIDGE_HISTORY_SYNC_TIMEOUT_SECONDS | toString -}}
{{- if or (not (regexMatch "^[1-9][0-9]{0,4}$" $startupBudget)) (gt (atoi $startupBudget) 86400) -}}
{{- fail "gateway.env.BRIDGE_HISTORY_SYNC_TIMEOUT_SECONDS must be an integer between 1 and 86400" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}-app
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-app
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway-app
  template:
    metadata:
      labels:
        {{- include "gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway-app
        {{- with .Values.gateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
        {{- if include "gateway.deploymentConfigInlineConfigMapEnabled" . }}
        checksum/deployment-config: {{ include (print $.Template.BasePath "/gateway/deployment-config-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if $tlsSecret }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      {{- with .Values.gateway.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        {{- if eq (include "gateway.yaciStoreEndpoint" .) (printf "http://%s:8080" (include "gateway.yaciStoreHost" .)) }}
        - name: wait-for-yaci-store
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              until nc -z {{ include "gateway.yaciStoreHost" . }} 8080 2>/dev/null; do
                echo waiting yaci-store; sleep 5
              done
              echo yaci-store ready
        {{- end }}
        - name: wait-for-gateway-db
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              until nc -z {{ include "gateway.gatewayDbHost" . }} {{ .Values.gateway.env.GATEWAY_DB_PORT }} 2>/dev/null; do
                echo waiting gateway-db; sleep 5
              done
              echo gateway-db ready

      containers:
        - name: gateway
          image: {{ include "gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gateway.fullname" . }}-env
          env:
            - name: GATEWAY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.gatewayDbSecretName" . }}
                  key: {{ include "gateway.gatewayDbSecretUsernameKey" . }}
            - name: GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.gatewayDbSecretName" . }}
                  key: {{ include "gateway.gatewayDbSecretPasswordKey" . }}
            {{- with .Values.gateway.blockfrostProjectIdSecret.name }}
            - name: CARDANO_BLOCKFROST_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.gateway.blockfrostProjectIdSecret.key | quote }}
            {{- end }}
          ports:
            - name: rest
              containerPort: {{ .Values.gateway.restPort }}
              protocol: TCP
            {{- if $tlsSecret }}
            - name: grpc
              containerPort: {{ .Values.gateway.grpcPort }}
              protocol: TCP
            {{- end }}
          {{- if or $mountManifest $tlsSecret }}
          volumeMounts:
            {{- if $mountManifest }}
            - name: deployment-config
              mountPath: {{ .Values.gateway.deploymentConfig.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $tlsSecret }}
            - name: grpc-tls
              mountPath: /etc/cardano-ibc-grpc
              readOnly: true
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.restPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: {{ add (div (add (atoi $startupBudget) 9) 10) 6 }}
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.gateway.restPort }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: {{ include "gateway.readinessHttpTimeoutSeconds" . }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.restPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      {{- if or $mountManifest $tlsSecret }}
      volumes:
        {{- if $mountManifest }}
        - name: deployment-config
          configMap:
            name: {{ include "gateway.deploymentConfigConfigMapName" . }}
            items:
              - key: {{ include "gateway.deploymentConfigKey" . }}
                path: {{ .Values.gateway.deploymentConfig.fileName | quote }}
        {{- end }}
        {{- if $tlsSecret }}
        - name: grpc-tls
          secret:
            secretName: {{ $tlsSecret | quote }}
            defaultMode: 288
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
      {{- end }}
