## cf-cardano-ibc — preview profile
##
## Cardano side cardano-node / ogmios / kupo / yaci-store follow public preview
## and serve a local follower. Hermes relays to Injective public testnet.
## Postgres (Zalando) + Injective RPC are external.

## ----- Cardano node -----------------------------------------------------------
## Network identifiers + preview protocol magic.
cf-cardano-node:
  network: preview
  protocolMagic: 2

## ----- Ogmios / Kupo ----------------------------------------------------------
## ogmios and kupo point at preview-compatible bundled node configs.
cf-ogmios:
  network: preview

cf-kupo:
  source: ogmios
  cardanoNode:
    network: preview
    networkMagic: 2
  since: origin
  match: "*"

## ----- Yaci Store -------------------------------------------------------------
## yaci-store chain-follows cardano-node over n2n (3001). The yaci-store image
## bundles preview genesis; the chart passes networkMagic=2 as
## STORE_CARDANO_PROTOCOL_MAGIC so yaci-store selects those embedded files.
## The preview sync checkpoint below MUST be a recent epoch-boundary block (1-2
## epochs before bridge deployment). Caribic normally resolves this via
## `caribic yaci-checkpoint --network preview --epochs-back 2`; for Helm, fill
## these at install time — leaving them at 0 is only valid for devnet.
yaci-store:
  enabled: true
  cardanoNode:
    # host: preview-node.play.dev.cardano.org
    # port: 3001
    networkMagic: 2
  syncStartSlot: "118575666"
  syncStartBlockHash: "88ac7f547bfa9dd418bdd5afecaa9c71397676b8d16f34cd638cfc154554a305"
  # syncStartSlot: "112406368"
  # syncStartBlockHash: "4df1ffe17f1dbec0969e23710b015306387724bbb3d9260af647d839df26a0e6"

## ----- Gateway ----------------------------------------------------------------
gateway:
  enabled: true
  image:
    tag: 0.0.1-PR554-f7fdf33
