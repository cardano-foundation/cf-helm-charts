{{- if .Values.swapClient.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dapps.swapFullname" . }}
  labels:
    app.kubernetes.io/name: swap-client
    app.kubernetes.io/part-of: cardano-ibc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swap-client
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swap-client
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: swap-client
          image: {{ printf "%s:%s" .Values.swapClient.image.repository (.Values.swapClient.image.tag | default "latest") | quote }}
          imagePullPolicy: {{ .Values.swapClient.image.pullPolicy }}
          env:
            - name: NEXT_PUBLIC_GATEWAY_TX_BUILDER_ENDPOINT
              value: {{ printf "http://%s-gateway:8000" .Release.Name | quote }}
            - name: IBC_SWAP_GATEWAY_TX_BUILDER_ENDPOINT
              value: {{ printf "http://%s-gateway:8000" .Release.Name | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.swapClient.port }}
              protocol: TCP
          resources: {{- toYaml .Values.swapClient.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dapps.swapFullname" . }}
  labels:
    app.kubernetes.io/name: swap-client
    app.kubernetes.io/part-of: cardano-ibc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: swap-client
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.swapClient.port }}
      targetPort: http
      protocol: TCP
{{- end }}