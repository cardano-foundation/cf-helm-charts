{{- if .Values.explorer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dapps.explorerFullname" . }}
  labels:
    app.kubernetes.io/name: ibc-explorer
    app.kubernetes.io/part-of: cardano-ibc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ibc-explorer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ibc-explorer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: explorer
          image: {{ printf "%s:%s" .Values.explorer.image.repository (.Values.explorer.image.tag | default "latest") | quote }}
          imagePullPolicy: {{ .Values.explorer.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.explorer.port | toString | quote }}
            - name: HOST
              value: "0.0.0.0"
          ports:
            - name: http
              containerPort: {{ .Values.explorer.port }}
              protocol: TCP
          resources: {{- toYaml .Values.explorer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dapps.explorerFullname" . }}
  labels:
    app.kubernetes.io/name: ibc-explorer
    app.kubernetes.io/part-of: cardano-ibc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ibc-explorer
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.explorer.port }}
      targetPort: http
      protocol: TCP
{{- end }}