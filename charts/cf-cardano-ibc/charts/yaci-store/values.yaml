image:
  repository: bloxbean/yaci-store
  ## 2.0.2.1 matches the local Caribic runtime and fixes CBOR parsing of
  ## post-protocol-11 public-testnet blocks.
  tag: "2.0.2.1"
  pullPolicy: IfNotPresent

## HTTP API port.
port: 8080

## cardano-node n2n endpoint (TCP chain-follow).
cardanoNode:
  host: ""     # resolved to <release>-cf-cardano-node by the helper
  port: 3001
  ## Yaci Store selects bundled public-network genesis files from protocol magic
  ## (1=preprod, 2=preview, 764824073=mainnet, 4=sanchonet).
  networkMagic: 1

## Yaci sync checkpoint — must be resolved for public nets (epoch-boundary block 1-2 epochs before deployment).
## syncStartBlockNo maps to Yaci's store.cardano.sync-start-byron-block-number
## property, which seeds the initial cursor block number when starting at a point.
syncStartSlot: 0
syncStartBlockHash: ""
syncStartBlockNo: 0

## Gateway's bridge-history projection needs tx/block CBOR from Yaci Store.
## These values map to Spring Boot properties:
## - store.transaction.save-cbor
## - store.blocks.save-cbor
## - store.cardano.return-tx-body-cbor
## - store.cardano.return-block-cbor
cbor:
  transactionSave: true
  blocksSave: true
  returnTxBody: true
  returnBlock: true

## Store module toggles. These mirror the local Caribic Yaci configuration so
## Gateway has the indexed block/tx/UTxO/script/staking data it expects while
## avoiding unused high-volume modules.
store:
  assetsEnabled: false
  metadataEnabled: false
  mirEnabled: false
  governanceEnabled: false
  epochEnabled: true
  blocksEnabled: true
  scriptEnabled: true
  stakingEnabled: true
  transactionEnabled: true
  utxoEnabled: true

executor:
  enableParallelProcessing: true
  blocksBatchSize: 50
  blocksPartitionSize: 10

## Default global values for standalone rendering. Parent umbrella values override these.
global:
  yaciDb:
    secretUsernameKey: username
    secretPasswordKey: password

## Yaci DB (Zalando PG) — parent global.yaciDb is the source of truth when set.
yaciDb:
  # host: ""             # resolved from global by helper
  port: 5432
  name: yaci             # overridden by global.yaciDb.name in the umbrella chart
  ## PostgreSQL JDBC sslmode. pgJDBC defaults to prefer; keep that explicit.
  sslMode: prefer
  # Credentials come from .Values.global.yaciDb (secretName/usernameKey/passwordKey).

resources: {}

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podLabels: {}
nodeSelector: {}
affinity: {}
tolerations: []
imagePullSecrets: []
