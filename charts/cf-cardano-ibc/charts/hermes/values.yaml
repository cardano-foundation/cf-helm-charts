image:
  repository: pro.registry.gitlab.metadata.dev.cf-deployments.org/base-infrastructure/docker-registry/cardano-ibc-hermes
  tag: ""
  pullPolicy: IfNotPresent

## Telemetry / REST ports (optional).
telemetry:
  enabled: true
  # Bind to all interfaces inside Kubernetes; the local ~/.hermes/config.toml uses 127.0.0.1.
  host: 0.0.0.0
  port: 3002
  buckets:
    latencySubmitted:
      start: 500
      end: 20000
      buckets: 10
    latencyConfirmed:
      start: 1000
      end: 30000
      buckets: 10
rest:
  enabled: false
  # Bind to all interfaces inside Kubernetes; the local ~/.hermes/config.toml uses 127.0.0.1.
  host: 0.0.0.0
  port: 3030

## Periodically reconstruct and clear packet commitments that were not relayed
## from their live event. Cardano proof queries can be temporarily unavailable
## while a new HostState waits for stability, so use a shorter recovery cadence
## than upstream Hermes's usual 100 blocks.
packetRelaying:
  clearInterval: 10
  clearOnStart: true
  txConfirmation: true

## Hermes chain configuration, rendered into config.toml.
## Values mirror the local ~/.hermes/config.toml knobs. The parent
## values-preview.yaml selects Cardano preview -> Injective testnet; bind hosts
## and Gateway discovery remain Kubernetes-specific.
config:
  logLevel: info
  cardano:
    chainId: cardano-preprod
    gatewayUrl: http://gateway:5001
    networkId: 0
    keyName: cardano-relayer
    account: 0
    keyStoreType: Test
    maxBlockTime: 20000ms
    clockDrift: 15m
    # Optional Cardano event-source overrides. Polling defaults to five seconds.
    eventPollInterval: ""
    # Gateway serves at most 101 heights per Events call. Hermes applies this
    # overlap both when initializing and polling, so its upstream default of 100
    # can advance a backlog by only one height per request. Fifty retains ample
    # late-indexing replay while allowing catch-up by roughly 51 heights/call.
    eventReplayWindow: "50"
    mithrilCertificationTimeout: 30m
    mithrilPollInterval: 5s
    mithrilWaitLogInterval: 30s
    trustThreshold:
      numerator: "2"
      denominator: "3"
    packetFilter:
      policy: allow
      list:
        - - transfer
          - "*"
  injective:
    chainId: injective-888
    rpcAddr: ""
    grpcAddr: ""
    eventSourceUrl: ""
    accountPrefix: inj
    keyName: injective-888-relayer
    addressType: ethermint
    defaultGas: "5000000"
    maxGas: "60000000"
    gasPrice:
      price: "500000000"
      denom: inj
    gasMultiplier: "1.8"
    maxMsgNum: "20"
    maxTxSize: "1000000"
    clockDrift: 20s
    maxBlockTime: 10s
    trustingPeriod: 10days
    memoPrefix: Caribic
    trustThreshold:
      numerator: "1"
      denominator: "3"
    # compat_mode omitted for testnet (local profile sets '0.38'); leave empty to skip
    compatMode: ""

## Optional periodic client-update sidecar. The standard Hermes daemon refreshes
## clients according to a fraction of their trusting period, which is too slow
## for Cardano probabilistic headers whose size grows with the block-height gap.
clientRefresh:
  enabled: false
  ## Required when enabled: the 08-cardano-probabilistic-* client hosted by Injective.
  injectiveCardanoClientId: ""
  ## Optional 07-tendermint-* client hosted by Cardano. It is only updated by
  ## the idle-heartbeat state machine below, never by the normal refresh loop.
  cardanoTendermintClientId: ""
  ## Wait briefly for the daemon's startup scan. No Cardano HostState is created
  ## until the full idle threshold has elapsed.
  initialDelaySeconds: 60
  ## Normal Injective-only cadence from caribic/README.md.
  intervalSeconds: 1200
  ## Retry infrastructure, stability-wait, or broadcast failures sooner than
  ## the normal cadence. After an idle Cardano heartbeat is attempted, retries
  ## only run the Injective leg so they cannot replace the maturing HostState.
  retryDelaySeconds: 300
  ## A Cardano-hosted update may wait for the Gateway's stability-accepted height.
  commandTimeoutSeconds: 2400
  idleHeartbeat:
    ## When disabled, the sidecar is exactly the documented Injective-only loop.
    enabled: false
    ## Create one Cardano HostState anchor only after the Injective-hosted
    ## Cardano client's latest height has not advanced for this long.
    idleThresholdSeconds: 1200
    ## How often to observe client height and re-check deferred idle heartbeats.
    observationIntervalSeconds: 60
    ## Timeout for each in-cluster Gateway channel-health request.
    healthQueryTimeoutSeconds: 10
    ## Every Cardano source channel sharing this client must be quiet before an
    ## idle heartbeat. Configure at least one channel when enabled.
    cardanoChannels: []
    # - portId: transfer
    #   channelId: channel-1
  resources: {}

## Hermes keyring JSON files — refer to a Secret, not created here.
## The referenced Secret values must contain the JSON files that Hermes reads from
## $HOME/.hermes/keys/<chain-id>/keyring-test/<key-name>.json, not raw mnemonics.
## The field names keep the older *MnemonicRef suffix for chart compatibility.
keys:
  cardanoMnemonicRef:
    name: hermes-keys
    key: cardano-relayer.json
  injectiveMnemonicRef:
    name: hermes-keys
    key: injective-888-relayer.json

resources: {}

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podLabels: {}
nodeSelector: {}
affinity: {}
tolerations: []
imagePullSecrets: []