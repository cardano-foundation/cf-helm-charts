{{- $idleChannels := list -}}
{{- range .Values.clientRefresh.idleHeartbeat.cardanoChannels -}}
{{- $portId := required "hermes.clientRefresh.idleHeartbeat.cardanoChannels[].portId is required" .portId -}}
{{- $channelId := required "hermes.clientRefresh.idleHeartbeat.cardanoChannels[].channelId is required" .channelId -}}
{{- $idleChannels = append $idleChannels (printf "%s:%s" $portId $channelId) -}}
{{- end -}}
{{- if and .Values.clientRefresh.enabled .Values.clientRefresh.idleHeartbeat.enabled (empty .Values.clientRefresh.cardanoTendermintClientId) -}}
{{- fail "hermes.clientRefresh.cardanoTendermintClientId is required when idle heartbeat is enabled" -}}
{{- end -}}
{{- if and .Values.clientRefresh.enabled .Values.clientRefresh.idleHeartbeat.enabled (eq (len $idleChannels) 0) -}}
{{- fail "hermes.clientRefresh.idleHeartbeat.cardanoChannels must contain at least one channel when idle heartbeat is enabled" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes.fullname" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hermes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hermes.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.clientRefresh.enabled }}
        checksum/client-refresh-script: {{ include (print $.Template.BasePath "/client-refresh-script-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - name: wait-for-gateway-grpc
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              until nc -z {{ .Release.Name }}-gateway 5001 2>/dev/null; do
                echo waiting gateway-gRPC; sleep 5
              done
              echo gateway-gRPC ready

      containers:
        - name: hermes
          image: {{ include "hermes.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{/* The image's ENTRYPOINT is hermes; run as a daemon. */}}
          args:
            - start
          env:
            - name: HERMES_HOME
              value: /home/hermes/.hermes
          volumeMounts:
            - name: config
              mountPath: /home/hermes/.hermes/config.toml
              subPath: config.toml
              readOnly: true
            - name: cardano-keyring-test
              mountPath: {{ printf "/home/hermes/.hermes/keys/%s/keyring-test" .Values.config.cardano.chainId | quote }}
              readOnly: true
            - name: injective-keyring-test
              mountPath: {{ printf "/home/hermes/.hermes/keys/%s/keyring-test" (include "hermes.injectiveChainId" .) | quote }}
              readOnly: true
          ports:
            {{- if .Values.telemetry.enabled }}
            - name: telemetry
              containerPort: {{ .Values.telemetry.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.rest.enabled }}
            - name: rest
              containerPort: {{ .Values.rest.port }}
              protocol: TCP
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}

        {{- if .Values.clientRefresh.enabled }}
        - name: client-refresh
          image: {{ include "hermes.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{/* Override the image's Hermes entrypoint and run the mounted refresh supervisor. */}}
          command:
            - /bin/bash
            - /opt/hermes-client-refresh/client-refresh.sh
          env:
            - name: HERMES_HOME
              value: /home/hermes/.hermes
            - name: HERMES_CONFIG
              value: /home/hermes/.hermes/config.toml
            - name: INJECTIVE_CHAIN_ID
              value: {{ include "hermes.injectiveChainId" . | quote }}
            - name: INJECTIVE_CARDANO_CLIENT_ID
              value: {{ required "hermes.clientRefresh.injectiveCardanoClientId is required when client refresh is enabled" .Values.clientRefresh.injectiveCardanoClientId | quote }}
            - name: CARDANO_CHAIN_ID
              value: {{ .Values.config.cardano.chainId | quote }}
            - name: CARDANO_TENDERMINT_CLIENT_ID
              value: {{ .Values.clientRefresh.cardanoTendermintClientId | quote }}
            - name: INITIAL_DELAY_SECONDS
              value: {{ .Values.clientRefresh.initialDelaySeconds | quote }}
            - name: INTERVAL_SECONDS
              value: {{ .Values.clientRefresh.intervalSeconds | quote }}
            - name: RETRY_DELAY_SECONDS
              value: {{ .Values.clientRefresh.retryDelaySeconds | quote }}
            - name: COMMAND_TIMEOUT_SECONDS
              value: {{ .Values.clientRefresh.commandTimeoutSeconds | quote }}
            - name: IDLE_HEARTBEAT_ENABLED
              value: {{ .Values.clientRefresh.idleHeartbeat.enabled | quote }}
            - name: IDLE_THRESHOLD_SECONDS
              value: {{ .Values.clientRefresh.idleHeartbeat.idleThresholdSeconds | quote }}
            - name: OBSERVATION_INTERVAL_SECONDS
              value: {{ .Values.clientRefresh.idleHeartbeat.observationIntervalSeconds | quote }}
            - name: HEALTH_QUERY_TIMEOUT_SECONDS
              value: {{ .Values.clientRefresh.idleHeartbeat.healthQueryTimeoutSeconds | quote }}
            - name: CARDANO_CHANNELS
              value: {{ join "," $idleChannels | quote }}
            - name: GATEWAY_REST_URL
              value: {{ include "hermes.gatewayRestUrl" . | quote }}
          volumeMounts:
            - name: config
              mountPath: /home/hermes/.hermes/config.toml
              subPath: config.toml
              readOnly: true
            - name: cardano-keyring-test
              mountPath: {{ printf "/home/hermes/.hermes/keys/%s/keyring-test" .Values.config.cardano.chainId | quote }}
              readOnly: true
            - name: injective-keyring-test
              mountPath: {{ printf "/home/hermes/.hermes/keys/%s/keyring-test" (include "hermes.injectiveChainId" .) | quote }}
              readOnly: true
            - name: client-refresh-script
              mountPath: /opt/hermes-client-refresh
              readOnly: true
          resources: {{- toYaml .Values.clientRefresh.resources | nindent 12 }}
        {{- end }}

      volumes:
        - name: config
          configMap:
            name: {{ include "hermes.fullname" . }}-config
        - name: cardano-keyring-test
          secret:
            secretName: {{ .Values.keys.cardanoMnemonicRef.name }}
            items:
              - key: {{ .Values.keys.cardanoMnemonicRef.key | quote }}
                path: {{ printf "%s.json" .Values.config.cardano.keyName | quote }}
        - name: injective-keyring-test
          secret:
            secretName: {{ .Values.keys.injectiveMnemonicRef.name }}
            items:
              - key: {{ .Values.keys.injectiveMnemonicRef.key | quote }}
                path: {{ printf "%s.json" .Values.config.injective.keyName | quote }}
        {{- if .Values.clientRefresh.enabled }}
        - name: client-refresh-script
          configMap:
            name: {{ include "hermes.fullname" . }}-client-refresh-script
            defaultMode: 0555
        {{- end }}
