{{- if .Values.clientRefresh.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hermes.fullname" . }}-client-refresh-script
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
data:
  client-refresh.sh: |
    set -uo pipefail

    output_file=/tmp/hermes-client-refresh.log
    QUERIED_CLIENT_HEIGHT=
    last_observed_height=
    last_advance_epoch="$(date +%s)"
    next_refresh_epoch=0
    next_idle_attempt_epoch=0
    awaiting_idle_anchor=0
    refresh_healthy=0

    log() {
      printf '%s [client-refresh] %s\n' "$(date -Iseconds)" "$*"
    }

    cleanup() {
      rm -f "${output_file}"
      exit 0
    }
    trap cleanup TERM INT

    update_client() {
      local host_chain="$1"
      local client_id="$2"
      local description="$3"
      local status

      log "updating ${description}: host_chain=${host_chain} client=${client_id}"
      rm -f "${output_file}"
      timeout --signal=TERM --kill-after=30s "${COMMAND_TIMEOUT_SECONDS}s" \
        /usr/bin/hermes --config "${HERMES_CONFIG}" update client \
          --host-chain "${host_chain}" \
          --client "${client_id}" \
        2>&1 | tee "${output_file}"
      status=${PIPESTATUS[0]}

      if [[ ${status} -eq 0 ]]; then
        log "${description} update completed"
        return 0
      fi

      # Hermes reports an already-current client as an error. It is a
      # successful refresh outcome, but not evidence that its height advanced.
      if grep -Fqi 'already up-to-date' "${output_file}"; then
        log "${description} is already up-to-date"
        return 0
      fi

      log "${description} update failed with exit code ${status}"
      return "${status}"
    }

    query_injective_client_height() {
      local status
      local height

      QUERIED_CLIENT_HEIGHT=
      rm -f "${output_file}"
      timeout --signal=TERM --kill-after=30s "${COMMAND_TIMEOUT_SECONDS}s" \
        /usr/bin/hermes --json --config "${HERMES_CONFIG}" query client state \
          --chain "${INJECTIVE_CHAIN_ID}" \
          --client "${INJECTIVE_CARDANO_CLIENT_ID}" \
        >"${output_file}" 2>&1
      status=$?

      if [[ ${status} -ne 0 ]]; then
        log "failed to query Injective-hosted Cardano client height (exit ${status}); idle heartbeat is fail-closed"
        return "${status}"
      fi

      height="$(
        grep -o '"latest_height"[[:space:]]*:[[:space:]]*{[^}]*}' "${output_file}" \
          | tail -n 1 \
          | grep -o '"revision_height"[[:space:]]*:[[:space:]]*[0-9]*' \
          | grep -o '[0-9]*' \
          | tail -n 1
      )"

      if [[ ! "${height}" =~ ^[0-9]+$ ]]; then
        log "could not parse latest_height from Hermes JSON output; idle heartbeat is fail-closed"
        return 1
      fi

      QUERIED_CLIENT_HEIGHT="${height}"
      return 0
    }

    record_client_height() {
      local height="$1"
      local now
      now="$(date +%s)"

      if [[ -z "${last_observed_height}" ]]; then
        last_observed_height="${height}"
        last_advance_epoch="${now}"
        next_idle_attempt_epoch=0
        log "initialized Injective-hosted Cardano client height at ${height}"
        return
      fi

      if (( height != last_observed_height )); then
        log "Injective-hosted Cardano client height changed: ${last_observed_height} -> ${height}; resetting idle timer"
        last_observed_height="${height}"
        last_advance_epoch="${now}"
        next_idle_attempt_epoch=0
      fi
    }

    channels_are_quiet() {
      local route
      local port_id
      local channel_id
      local url
      local state
      local pending_count
      local -a routes

      IFS=',' read -r -a routes <<< "${CARDANO_CHANNELS}"
      for route in "${routes[@]}"; do
        port_id="${route%%:*}"
        channel_id="${route#*:}"

        if [[ "${route}" != *:* || -z "${port_id}" || -z "${channel_id}" ]]; then
          log "invalid Cardano channel descriptor '${route}'; idle heartbeat is fail-closed"
          return 1
        fi

        url="${GATEWAY_REST_URL}/api/cardano/channels/${channel_id}/health?port_id=${port_id}"
        rm -f "${output_file}"
        if ! wget -qO "${output_file}" --timeout="${HEALTH_QUERY_TIMEOUT_SECONDS}" --tries=1 "${url}"; then
          log "failed to query health for ${port_id}/${channel_id}; idle heartbeat deferred"
          return 1
        fi

        state="$(sed -n 's/.*"state"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "${output_file}")"
        pending_count="$(sed -n 's/.*"pending_packet_commitment_count"[[:space:]]*:[[:space:]]*"\{0,1\}\([0-9][0-9]*\)"\{0,1\}.*/\1/p' "${output_file}")"

        if [[ "${state}" != Open || ! "${pending_count}" =~ ^[0-9]+$ ]]; then
          log "unusable health response for ${port_id}/${channel_id}: state='${state}' pending='${pending_count}'; idle heartbeat deferred"
          return 1
        fi

        if (( pending_count != 0 )); then
          log "${port_id}/${channel_id} has ${pending_count} pending packet commitment(s); idle heartbeat deferred"
          return 1
        fi
      done

      return 0
    }

    if [[ "${IDLE_HEARTBEAT_ENABLED}" == true ]]; then
      if [[ -z "${CARDANO_TENDERMINT_CLIENT_ID}" || -z "${CARDANO_CHANNELS}" ]]; then
        log "idle heartbeat requires a Cardano Tendermint client and at least one Cardano channel"
        exit 1
      fi
    fi

    log "starting; initial_delay=${INITIAL_DELAY_SECONDS}s interval=${INTERVAL_SECONDS}s retry_delay=${RETRY_DELAY_SECONDS}s observation_interval=${OBSERVATION_INTERVAL_SECONDS}s idle_heartbeat=${IDLE_HEARTBEAT_ENABLED} idle_threshold=${IDLE_THRESHOLD_SECONDS}s"
    sleep "${INITIAL_DELAY_SECONDS}"

    while true; do
      observed_this_iteration=0

      if query_injective_client_height; then
        record_client_height "${QUERIED_CLIENT_HEIGHT}"
        observed_this_iteration=1
      fi

      now="$(date +%s)"

      # Once an idle Cardano heartbeat has been attempted, never repeat that leg.
      # Retry only the Injective update until the anchor becomes accepted. A failed
      # Cardano command has an uncertain broadcast outcome, so it also enters this
      # conservative second-leg-only state.
      if [[ ${awaiting_idle_anchor} -eq 1 ]]; then
        if (( now >= next_refresh_epoch )); then
          if update_client \
            "${INJECTIVE_CHAIN_ID}" \
            "${INJECTIVE_CARDANO_CLIENT_ID}" \
            'Injective-hosted Cardano client'; then
            if query_injective_client_height; then
              record_client_height "${QUERIED_CLIENT_HEIGHT}"
            fi
            now="$(date +%s)"
            last_advance_epoch="${now}"
            next_idle_attempt_epoch=0
            awaiting_idle_anchor=0
            refresh_healthy=1
            next_refresh_epoch=$((now + INTERVAL_SECONDS))
            log "idle heartbeat completed; returning to Injective-only refreshes"
          else
            refresh_healthy=0
            now="$(date +%s)"
            next_refresh_epoch=$((now + RETRY_DELAY_SECONDS))
            log "idle anchor is not consumable yet; preserving it and retrying only the Injective update in ${RETRY_DELAY_SECONDS}s"
          fi
        fi

        sleep "${OBSERVATION_INTERVAL_SECONDS}"
        continue
      fi

      # The normal path from caribic/README.md: update only the Cardano client
      # hosted by Injective. This cannot create or replace a Cardano HostState.
      if (( now >= next_refresh_epoch )); then
        if update_client \
          "${INJECTIVE_CHAIN_ID}" \
          "${INJECTIVE_CARDANO_CLIENT_ID}" \
          'Injective-hosted Cardano client'; then
          refresh_healthy=1
          now="$(date +%s)"
          next_refresh_epoch=$((now + INTERVAL_SECONDS))
        else
          refresh_healthy=0
          now="$(date +%s)"
          next_refresh_epoch=$((now + RETRY_DELAY_SECONDS))
        fi

        # Require a reliable post-update observation before deciding the route is
        # idle. This also notices updates submitted concurrently by the daemon.
        observed_this_iteration=0
        if query_injective_client_height; then
          record_client_height "${QUERIED_CLIENT_HEIGHT}"
          observed_this_iteration=1
        fi
        now="$(date +%s)"
      fi

      if [[ "${IDLE_HEARTBEAT_ENABLED}" == true \
        && ${observed_this_iteration} -eq 1 \
        && ${refresh_healthy} -eq 1 \
        && ${now} -ge ${next_idle_attempt_epoch} \
        && $((now - last_advance_epoch)) -ge ${IDLE_THRESHOLD_SECONDS} ]]; then
        log "client height ${last_observed_height} has been idle for $((now - last_advance_epoch))s; checking whether Cardano channels are quiet"

        if channels_are_quiet; then
          log "all configured Cardano channels are quiet; creating one idle HostState anchor"
          if ! update_client \
            "${CARDANO_CHAIN_ID}" \
            "${CARDANO_TENDERMINT_CLIENT_ID}" \
            'Cardano-hosted Tendermint client'; then
            log "Cardano heartbeat command failed; its broadcast outcome may be uncertain, so the Cardano leg will not be repeated"
          fi

          awaiting_idle_anchor=1
          next_refresh_epoch="$(date +%s)"
        else
          next_idle_attempt_epoch=$((now + RETRY_DELAY_SECONDS))
        fi
      fi

      sleep "${OBSERVATION_INTERVAL_SECONDS}"
    done
{{- end }}
