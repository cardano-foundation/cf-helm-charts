{{/* Hermes config.toml rendered from values.
   Cardano block mirrors caribic/config/hermes-config.example.toml.
   Injective block mirrors caribic/src/chains/injective/hermes.rs::testnet_chain_profile(). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hermes.fullname" . }}-config
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
data:
  config.toml: |
    [global]
    log_level = '{{ .Values.config.logLevel }}'

    [telemetry]
    enabled = {{ .Values.telemetry.enabled }}
    host = '0.0.0.0'
    port = {{ .Values.telemetry.port }}

    [rest]
    enabled = {{ .Values.rest.enabled }}
    host = '0.0.0.0'
    port = {{ .Values.rest.port }}

    [mode.clients]
    enabled = true
    refresh = true
    misbehaviour = true

    [mode.connections]
    enabled = true

    [mode.channels]
    enabled = true

    [mode.packets]
    enabled = true
    clear_interval = 100
    clear_on_start = true
    tx_confirmation = true

    [[chains]]
    type = 'Cardano'
    id = '{{ .Values.config.cardano.chainId }}'
    gateway_url = '{{ include "hermes.gatewayUrl" . }}'
    network_id = {{ .Values.config.cardano.networkId }}
    key_name = '{{ .Values.config.cardano.keyName }}'
    {{- with .Values.config.cardano.keyStoreType }}
    key_store_type = '{{ . }}'
    {{- end }}
    account = {{ .Values.config.cardano.account }}
    max_block_time = '{{ .Values.config.cardano.maxBlockTime }}'
    clock_drift = '{{ .Values.config.cardano.clockDrift }}'
    mithril_certification_timeout = '{{ .Values.config.cardano.mithrilCertificationTimeout }}'
    mithril_poll_interval = '{{ .Values.config.cardano.mithrilPollInterval }}'
    mithril_wait_log_interval = '{{ .Values.config.cardano.mithrilWaitLogInterval }}'
    trust_threshold = { numerator = '{{ .Values.config.cardano.trustThreshold.numerator }}', denominator = '{{ .Values.config.cardano.trustThreshold.denominator }}' }

    [chains.packet_filter]
    policy = '{{ .Values.config.cardano.packetFilter.policy }}'
    list = [
      {{- range .Values.config.cardano.packetFilter.list }}
      {{- if kindIs "slice" . }}
      ['{{ index . 0 }}', '{{ index . 1 }}'],
      {{- else }}
      ['{{ . }}'],
      {{- end }}
      {{- end }}
    ]

    [[chains]]
    type = 'CosmosSdk'
    id = '{{ include "hermes.injectiveChainId" . }}'
    rpc_addr = '{{ include "hermes.injectiveRpcAddr" . }}'
    grpc_addr = '{{ include "hermes.injectiveGrpcAddr" . }}'
    event_source = { mode = 'push', url = '{{ include "hermes.injectiveEventSourceUrl" . }}', batch_delay = '200ms' }
    rpc_timeout = '10s'
    account_prefix = '{{ .Values.config.injective.accountPrefix }}'
    key_name = '{{ .Values.config.injective.keyName }}'
    address_type = { derivation = '{{ .Values.config.injective.addressType }}', proto_type = { pk_type = '/injective.crypto.v1beta1.ethsecp256k1.PubKey' } }
    store_prefix = 'ibc'
    default_gas = {{ .Values.config.injective.defaultGas }}
    max_gas = {{ .Values.config.injective.maxGas }}
    gas_price = { price = {{ .Values.config.injective.gasPrice.price }}, denom = '{{ .Values.config.injective.gasPrice.denom }}' }
    gas_multiplier = {{ .Values.config.injective.gasMultiplier }}
    max_msg_num = {{ .Values.config.injective.maxMsgNum }}
    max_tx_size = {{ .Values.config.injective.maxTxSize }}
    clock_drift = '{{ .Values.config.injective.clockDrift }}'
    max_block_time = '{{ .Values.config.injective.maxBlockTime }}'
    trusting_period = '{{ .Values.config.injective.trustingPeriod }}'
    memo_prefix = '{{ .Values.config.injective.memoPrefix }}'
    trust_threshold = { numerator = '{{ .Values.config.injective.trustThreshold.numerator }}', denominator = '{{ .Values.config.injective.trustThreshold.denominator }}' }
    {{- if .Values.config.injective.compatMode }}
    compat_mode = '{{ .Values.config.injective.compatMode }}'
    {{- end }}
