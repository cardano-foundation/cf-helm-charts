{{- $deploymentConfigSource := include "gateway.deploymentConfigSource" . -}}
{{- if and $deploymentConfigSource (not (or (eq $deploymentConfigSource "handlerJson") (eq $deploymentConfigSource "bridgeManifest"))) -}}
{{- fail "gateway.deploymentConfig.source must be one of: '', 'handlerJson', 'bridgeManifest'" -}}
{{- end -}}
{{- if and .Values.env.HANDLER_JSON_PATH .Values.env.BRIDGE_MANIFEST_PATH (not $deploymentConfigSource) -}}
{{- fail "gateway env HANDLER_JSON_PATH and BRIDGE_MANIFEST_PATH are mutually exclusive; set only one, or use gateway.deploymentConfig.source" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.fullname" . }}-env
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.env.PORT | quote }}
  GRPC_HOST: {{ .Values.env.GRPC_HOST | quote }}
  GRPC_PORT: {{ .Values.env.GRPC_PORT | quote }}

  CARDANO_CHAIN_ID: {{ .Values.env.CARDANO_CHAIN_ID | quote }}
  CARDANO_NETWORK_MAGIC: {{ .Values.env.CARDANO_NETWORK_MAGIC | quote }}
  CARDANO_LIGHT_CLIENT_MODE: {{ .Values.env.CARDANO_LIGHT_CLIENT_MODE | quote }}
  CARDANO_EPOCH_NONCE_GENESIS: {{ .Values.env.CARDANO_EPOCH_NONCE_GENESIS | quote }}
  CARDANO_EPOCH_PARAMS_ENDPOINT: {{ .Values.env.CARDANO_EPOCH_PARAMS_ENDPOINT | quote }}
  CARDANO_POOL_REGISTRATION_HISTORY_ENDPOINT: {{ .Values.env.CARDANO_POOL_REGISTRATION_HISTORY_ENDPOINT | quote }}
  CARDANO_STABILITY_THRESHOLD_DEPTH: {{ .Values.env.CARDANO_STABILITY_THRESHOLD_DEPTH | quote }}
  CARDANO_STABILITY_THRESHOLD_UNIQUE_POOLS: {{ .Values.env.CARDANO_STABILITY_THRESHOLD_UNIQUE_POOLS | quote }}
  CARDANO_STABILITY_THRESHOLD_UNIQUE_STAKE_BPS: {{ .Values.env.CARDANO_STABILITY_THRESHOLD_UNIQUE_STAKE_BPS | quote }}
{{- with .Values.env.CARDANO_STABILITY_ASSUME_POOL_REGISTRATION_SLOT }}
  CARDANO_STABILITY_ASSUME_POOL_REGISTRATION_SLOT: {{ . | quote }}
{{- end }}
{{- with .Values.env.CARDANO_PROBABILISTIC_EPOCH_NONCE_OVERRIDE }}
  CARDANO_PROBABILISTIC_EPOCH_NONCE_OVERRIDE: {{ . | quote }}
{{- end }}

{{- if eq $deploymentConfigSource "handlerJson" }}
  HANDLER_JSON_PATH: {{ include "gateway.deploymentConfigPath" . | quote }}
{{- else if eq $deploymentConfigSource "bridgeManifest" }}
  BRIDGE_MANIFEST_PATH: {{ include "gateway.deploymentConfigPath" . | quote }}
{{- else }}
{{- with .Values.env.HANDLER_JSON_PATH }}
  HANDLER_JSON_PATH: {{ . | quote }}
{{- end }}
{{- with .Values.env.BRIDGE_MANIFEST_PATH }}
  BRIDGE_MANIFEST_PATH: {{ . | quote }}
{{- end }}
{{- end }}

  KUPO_ENDPOINT: {{ include "gateway.kupoEndpoint" . | quote }}
  OGMIOS_ENDPOINT: {{ include "gateway.ogmiosEndpoint" . | quote }}
  YACI_STORE_ENDPOINT: {{ include "gateway.yaciStoreEndpoint" . | quote }}
  CARDANO_CHAIN_HOST: {{ include "gateway.cardanoNodeHost" . | quote }}
  CARDANO_CHAIN_PORT: {{ .Values.env.CARDANO_CHAIN_PORT | quote }}

  GATEWAY_DB_HOST: {{ include "gateway.gatewayDbHost" . | quote }}
  GATEWAY_DB_PORT: {{ .Values.env.GATEWAY_DB_PORT | default "5432" | quote }}
  GATEWAY_DB_NAME: {{ include "gateway.gatewayDbName" . | quote }}
  GATEWAY_DB_SYNCHRONIZE: {{ .Values.env.GATEWAY_DB_SYNCHRONIZE | quote }}
{{- with .Values.env.PGSSLMODE }}
  PGSSLMODE: {{ . | quote }}
{{- end }}

  HISTORY_DB_HOST: {{ include "gateway.yaciDbHost" . | quote }}
  HISTORY_DB_PORT: {{ .Values.env.HISTORY_DB_PORT | default "5432" | quote }}
  HISTORY_DB_NAME: {{ include "gateway.yaciDbName" . | quote }}
