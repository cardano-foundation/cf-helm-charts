apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}-app
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-app
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway-app
  template:
    metadata:
      labels:
        {{- include "gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway-app
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - name: wait-for-yaci-store
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              until nc -z {{ .Release.Name }}-yaci-store 8080 2>/dev/null; do
                echo waiting yaci-store; sleep 5
              done
              echo yaci-store ready
        - name: wait-for-gateway-db
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              until nc -z {{ include "gateway.gatewayDbHost" . }} 5432 2>/dev/null; do
                echo waiting gateway-db; sleep 5
              done
              echo gateway-db ready

      containers:
        - name: gateway
          image: {{ include "gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gateway.fullname" . }}-env
            {{- if .Values.secrets.deployerSkRef }}
            - secretRef:
                name: {{ .Values.secrets.deployerSkRef.name }}
            {{- end }}
          env:
            - name: GATEWAY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.gatewayDbSecretName" . }}
                  key: {{ (index .Values.global "gatewayDb").secretUsernameKey }}
            - name: GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.gatewayDbSecretName" . }}
                  key: {{ (index .Values.global "gatewayDb").secretPasswordKey }}
            - name: HISTORY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.yaciDbSecretName" . }}
                  key: {{ (index .Values.global "yaciDb").secretUsernameKey }}
            - name: HISTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.yaciDbSecretName" . }}
                  key: {{ (index .Values.global "yaciDb").secretPasswordKey }}
          ports:
            - name: rest
              containerPort: {{ .Values.restPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.grpcPort }}
              protocol: TCP
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.restPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.restPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.restPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
---
{{- if .Values.historySync.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}-history-sync
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-history-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway-history-sync
  template:
    metadata:
      labels:
        {{- include "gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway-history-sync
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-yaci-store
          image: busybox:1.36
          command:
            - sh
            - -c
          args:
            - |
              until nc -z {{ .Release.Name }}-yaci-store 8080 2>/dev/null; do
                echo waiting yaci-store; sleep 5
              done
      containers:
        - name: history-sync
          image: {{ include "gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - dist/scripts/yaci-bridge-history-sync.js
          envFrom:
            - configMapRef:
                name: {{ include "gateway.fullname" . }}-env
          resources: {{- toYaml .Values.historySyncResources | nindent 12 }}
{{- end }}