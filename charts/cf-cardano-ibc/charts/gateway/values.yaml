image:
  repository: pro.registry.gitlab.metadata.dev.cf-deployments.org/base-infrastructure/docker-registry/cardano-ibc-gateway
  tag: ""
  pullPolicy: IfNotPresent

## Ports.
restPort: 8000
grpcPort: 5001

## Whether to also deploy the bridge-history-sync sidecar Deployment.
historySync:
  enabled: true

## Bridge deployment config consumed by Gateway at startup. The Gateway accepts
## exactly one of HANDLER_JSON_PATH or BRIDGE_MANIFEST_PATH. Leave source empty
## to use env.HANDLER_JSON_PATH / env.BRIDGE_MANIFEST_PATH directly (legacy).
## Set source to handlerJson or bridgeManifest to have the chart render the
## matching env var and optionally mount the file from a ConfigMap.
deploymentConfig:
  ## "", "handlerJson", or "bridgeManifest".
  source: bridgeManifest
  ## Absolute path to use when no ConfigMap mount is needed (for example a
  ## manifest baked into the image). Ignored when configMap.name/content is set.
  ## If empty and source is set, defaults to <mountPath>/<fileName>.
  path: /usr/src/app/manifests/preprod/cardano-preprod-bridge-manifest.json
  mountPath: /etc/cardano-ibc
  ## Defaults to handler.json for handlerJson, bridge-manifest.json for bridgeManifest.
  fileName: ""
  configMap:
    ## Existing ConfigMap to mount. Leave empty when using `content` below or a baked file path.
    name: ""
    ## Key in the ConfigMap. Defaults to fileName.
    key: ""
    ## Optional inline file content; when set, this chart creates a ConfigMap.
    content: ""

## Gateway env rendered into a ConfigMap (see deployment.yaml). Endpoints below
## default to in-cluster Service names; override per-environment in values.
env:
  PORT: "8000"
  GRPC_HOST: "0.0.0.0"
  GRPC_PORT: "5001"

  CARDANO_CHAIN_ID: cardano-preprod
  CARDANO_NETWORK_MAGIC: "1"
  CARDANO_LIGHT_CLIENT_MODE: stake-weighted-stability
  CARDANO_EPOCH_NONCE_GENESIS: ""
  CARDANO_STABILITY_THRESHOLD_DEPTH: "10"
  CARDANO_STABILITY_THRESHOLD_UNIQUE_POOLS: "2"
  CARDANO_STABILITY_THRESHOLD_UNIQUE_STAKE_BPS: "6000"

  # Endpoints — leave empty to resolve to this release's in-cluster Services
  # (<release>-cf-kupo, <release>-cf-ogmios, <release>-yaci-store).
  KUPO_ENDPOINT: ""
  OGMIOS_ENDPOINT: ""
  YACI_STORE_ENDPOINT: ""
  CARDANO_CHAIN_HOST: cardano-node
  CARDANO_CHAIN_PORT: "3001"

  GATEWAY_DB_PORT: "5432"
  HISTORY_DB_PORT: "5432"
  ## node-postgres/TypeORM reads PGSSLMODE. Use no-verify for Zalando/Spilo
  ## clusters with self-signed internal TLS certificates.
  PGSSLMODE: no-verify
  GATEWAY_DB_SYNCHRONIZE: "true"

resources: {}

## Optional public HTTP ingress for the Gateway REST API only. Hermes gRPC
## traffic stays in-cluster on the Service's grpc port.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gateway.example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

historySyncResources: {}

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podLabels: {}
nodeSelector: {}
affinity: {}
tolerations: []
imagePullSecrets: []