{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cf-cardano-x402-facilitator.fullname" . }}
  labels:
    {{- include "cf-cardano-x402-facilitator.labels" . | nindent 4 }}
    app.kubernetes.io/component: facilitator
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cf-cardano-x402-facilitator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: facilitator
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
