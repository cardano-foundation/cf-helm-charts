{{/* Zalando Postgres Operator cluster for the facilitator.
     The prepared database creates an owner user and a credential Secret named:
     <database>-owner-user.<cluster>.credentials.postgresql.acid.zalan.do */}}
{{- if .Values.postgres.enabled }}
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: {{ include "cf-cardano-x402-facilitator.postgresClusterName" . | quote }}
  namespace: {{ include "cf-cardano-x402-facilitator.postgresNamespace" . | quote }}
  labels:
    {{- include "cf-cardano-x402-facilitator.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  {{- with .Values.postgres.controller }}
  annotations:
    acid.zalan.do/controller: {{ . | quote }}
  {{- end }}
spec:
  teamId: {{ .Values.postgres.teamId | quote }}
  volume:
    size: {{ .Values.postgres.volume.size | quote }}
    {{- with .Values.postgres.volume.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  numberOfInstances: {{ .Values.postgres.numberOfInstances }}
  {{- $clone := default (dict) .Values.postgres.clone }}
  {{- if or $clone.clusterName $clone.uid $clone.timestamp $clone.s3WalPath $clone.s3Endpoint }}
  {{- if not $clone.clusterName }}
  {{- fail "postgres.clone: clusterName is required" }}
  {{- end }}
  {{- if and $clone.timestamp (not $clone.uid) }}
  {{- fail "postgres.clone: uid is required when timestamp is set" }}
  {{- end }}
  {{- if $clone.timestamp }}
  {{- if not (kindIs "string" $clone.timestamp) }}
  {{- fail "postgres.clone: timestamp must be a quoted string, e.g. timestamp: \"2026-02-14T10:30:00+00:00\"" }}
  {{- end }}
  {{- if not (regexMatch "(Z|[+-][0-9]{2}:?[0-9]{2})$" $clone.timestamp) }}
  {{- fail "postgres.clone: timestamp needs a UTC offset, e.g. 2026-02-14T10:30:00+00:00" }}
  {{- end }}
  {{- end }}
  {{- if or (and $clone.s3AccessKeyId (not $clone.s3SecretAccessKey)) (and $clone.s3SecretAccessKey (not $clone.s3AccessKeyId)) }}
  {{- fail "postgres.clone: s3AccessKeyId and s3SecretAccessKey must be set together" }}
  {{- end }}
  clone:
    cluster: {{ $clone.clusterName | quote }}
    {{- with $clone.uid }}
    uid: {{ . | quote }}
    {{- end }}
    {{- with $clone.timestamp }}
    timestamp: {{ . | quote }}
    {{- end }}
    {{- with $clone.s3WalPath }}
    s3_wal_path: {{ . | quote }}
    {{- end }}
    {{- with $clone.s3Endpoint }}
    s3_endpoint: {{ . | quote }}
    {{- end }}
    {{- with $clone.s3AccessKeyId }}
    s3_access_key_id: {{ . | quote }}
    {{- end }}
    {{- with $clone.s3SecretAccessKey }}
    s3_secret_access_key: {{ . | quote }}
    {{- end }}
    {{- if kindIs "bool" $clone.s3ForcePathStyle }}
    s3_force_path_style: {{ $clone.s3ForcePathStyle }}
    {{- end }}
  {{- end }}
  enableConnectionPooler: {{ .Values.postgres.connectionPooler.enabled }}
  {{- with .Values.postgres.patroni }}
  patroni:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.postgres.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.postgres.additionalEnv }}
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  preparedDatabases:
    {{ required "database.name is required" .Values.database.name | quote }}:
      defaultUsers: true
      secretNamespace: {{ include "cf-cardano-x402-facilitator.postgresSecretNamespace" . | quote }}

  postgresql:
    version: {{ .Values.postgres.version | quote }}
    {{- with .Values.postgres.parameters }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  {{- with .Values.postgres.sidecars }}
  sidecars:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
