apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cf-cardano-x402-facilitator.fullname" . }}
  labels:
    {{- include "cf-cardano-x402-facilitator.labels" . | nindent 4 }}
    app.kubernetes.io/component: facilitator
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "cf-cardano-x402-facilitator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: facilitator
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cf-cardano-x402-facilitator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: facilitator
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: facilitator
          image: {{ include "cf-cardano-x402-facilitator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.port | toString | quote }}
            - name: DB_URL
              value: {{ include "cf-cardano-x402-facilitator.databaseUrl" . | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "cf-cardano-x402-facilitator.databaseSecretName" . | quote }}
                  key: {{ .Values.database.secretUsernameKey | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cf-cardano-x402-facilitator.databaseSecretName" . | quote }}
                  key: {{ .Values.database.secretPasswordKey | quote }}
            - name: DB_SCHEMA
              value: {{ .Values.database.schema | quote }}
            - name: BLOCKFROST_BASE_URL
              value: {{ .Values.blockfrost.baseUrl | quote }}
            - name: BLOCKFROST_PROJECT_ID
              {{- if .Values.blockfrost.existingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.blockfrost.existingSecret.name | quote }}
                  key: {{ .Values.blockfrost.existingSecret.key | quote }}
              {{- else }}
              value: {{ .Values.blockfrost.projectId | quote }}
              {{- end }}
            - name: X402_NETWORK_ID
              value: {{ .Values.networkId | quote }}
            {{- with .Values.javaOpts }}
            - name: JAVA_OPTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
