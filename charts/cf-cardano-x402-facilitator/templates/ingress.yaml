{{- if .Values.ingress.enabled }}
{{- if not .Values.service.enabled }}
{{- fail "service.enabled must be true when ingress.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cf-cardano-x402-facilitator.fullname" . }}
  labels:
    {{- include "cf-cardano-x402-facilitator.labels" . | nindent 4 }}
    app.kubernetes.io/component: facilitator
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /* Keep this allow-list explicit. A catch-all Prefix path would also
                 expose Spring Boot's /actuator endpoints. */}}
          - path: /verify
            pathType: Exact
            backend:
              service:
                name: {{ include "cf-cardano-x402-facilitator.fullname" $ }}
                port:
                  name: http
          - path: /settle
            pathType: Exact
            backend:
              service:
                name: {{ include "cf-cardano-x402-facilitator.fullname" $ }}
                port:
                  name: http
          - path: /supported
            pathType: Exact
            backend:
              service:
                name: {{ include "cf-cardano-x402-facilitator.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
